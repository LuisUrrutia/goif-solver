apiVersion: apps/v1
kind: Deployment
metadata:
  name: goif-solver
spec:
  replicas: 2
  minReadySeconds: 5
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: goif-solver
  template:
    metadata:
      labels:
        app: goif-solver
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: goif-solver
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: goif-solver
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: solver
          image: goif-solver:dev
          imagePullPolicy: IfNotPresent
          args: ["run", "-config", "/etc/goif/testnet.json"]
          env:
            - name: SSL_CERT_FILE
              value: /etc/goif-redis-ca/ca.crt
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - secretRef:
                name: goif-solver-secrets
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 120
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/goif
              readOnly: true
            - name: redis-ca
              mountPath: /etc/goif-redis-ca
              readOnly: true
      volumes:
        - name: redis-ca
          secret:
            secretName: goif-redis-tls
            optional: true
            items:
              - key: ca.crt
                path: ca.crt
        - name: config
          configMap:
            name: goif-solver-config
---
apiVersion: v1
kind: Service
metadata:
  name: goif-solver
spec:
  selector:
    app: goif-solver
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: goif-solver
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: goif-solver
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: goif-solver-ingress
spec:
  podSelector:
    matchLabels:
      app: goif-solver
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              goif-solver-access: "true"
      ports:
        - protocol: TCP
          port: 8080
